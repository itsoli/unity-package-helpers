[package]
name = "package-update"
version = "1.3.1"
description = "Helper tool to update UPM package versions and release notes"
edition = "2024"

[dependencies]
clap = { version = "^4.5.50", features = ["derive"] }
git2 = "^0.20.2"
owo-colors = "^4.2.3"
package-lib = { path = "../package-lib" }
serde_json = { version = "^1.0.145", features = ["preserve_order"] }
